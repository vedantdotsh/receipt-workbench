<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Receipt Workbench</title>
<style>
/* One table for the batch. A row opens in three steps: summary, details (page + fields), clarification.
   Colour is used for status only. */
:root {
  --bg: #faf8f4; --sf: #fffefb; --sunk: #f3f0e9; --line: #e6e0d4; --fg: #2d2a26; --mu: #6f695f;
  --pr: #2d2a26; --pr-fg: #ffffff;
  --red: #b5422f; --red-bg: #fbe9e5; --amber: #946c0c; --green: #2f7d55; --blue: #2b6fd0;
  --sans: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "Cascadia Mono", Consolas, "SF Mono", monospace;
}
@media (prefers-color-scheme: dark) { :root {
  --bg: #1d1c1a; --sf: #252422; --sunk: #2d2b28; --line: #3a3732; --fg: #e6e3dd; --mu: #a39d92;
  --pr: #e6e3dd; --pr-fg: #1d1c1a;
  --red: #e98876; --red-bg: #47271f; --amber: #d6ad55; --green: #6fbf93; --blue: #8fb6f2; color-scheme: dark } }
* { box-sizing: border-box }
body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.5 var(--sans); font-variant-numeric: tabular-nums }
button, textarea { font: inherit; color: inherit }
button { cursor: pointer }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px }
[hidden] { display: none !important }
.mu { color: var(--mu) }
.btn { border: 1px solid var(--line); background: var(--sf); border-radius: 8px; padding: 7px 13px; white-space: nowrap; text-decoration: none; color: inherit; display: inline-block }
.btn:hover { background: var(--sunk) }
.btn.p { background: var(--pr); color: var(--pr-fg); border-color: var(--pr) } .btn.p:hover { opacity: .9 }
.link { border: 0; background: none; padding: 7px 2px; color: var(--mu); text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--line) }
.link:hover { color: var(--fg) }
.seg { display: inline-flex; gap: 2px }
.seg button { border: 0; background: none; padding: 4px 6px; color: var(--mu); border-radius: 6px }
.seg button[aria-pressed="true"] { color: var(--fg); font-weight: 600 }

header { display: flex; align-items: center; gap: 14px; padding: 14px 24px; border-bottom: 1px solid var(--line); flex-wrap: wrap }
header h1 { font-size: 14.5px; margin: 0; font-weight: 600; flex: 1 }
main { max-width: 1080px; margin: 0 auto; padding: 28px 24px 60px }
.top { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; margin-bottom: 16px }
.top h2 { font-size: 22px; line-height: 1.25; margin: 0; font-weight: 600; letter-spacing: -.015em; flex: 1; min-width: 240px }
#empty { max-width: 600px; margin: 40px auto; text-align: center }
#empty h2 { font-size: 22px; margin: 0 0 10px; line-height: 1.25; letter-spacing: -.015em; text-wrap: balance }
#empty p { color: var(--mu); margin: 0 0 20px }
body.over main { outline: 2px dashed var(--mu); outline-offset: -8px; border-radius: 14px }

.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; background: var(--green) }
.dot.r { background: var(--red) } .dot.a { background: var(--amber) } .dot.n { background: var(--line) }

table.batch { width: 100%; border-collapse: separate; border-spacing: 0; background: var(--sf); border: 1px solid var(--line); border-radius: 10px; overflow: clip }
.batch th { text-align: left; font-weight: 400; font-size: 12.5px; color: var(--mu); padding: 9px 12px }
.batch th:nth-child(4), .batch td.amt { text-align: right; white-space: nowrap }
.batch tr.item td { padding: 10px 12px; border-top: 1px solid var(--line) }
.batch tr.item { cursor: pointer } .batch tr.item:hover { background: var(--sunk) }
.batch tr.item[aria-expanded="true"] { background: none }
.batch tr.item.fine td { color: var(--mu) }
.batch td.d { width: 32px; padding-right: 0 !important }
.batch td.from { color: var(--mu) } .batch td.no { font-weight: 500; white-space: nowrap }
.batch .done { color: var(--mu) }
.batch tr.open > td { padding: 2px 16px 18px 44px }

.sum h3 { font-size: 17px; margin: 0; font-weight: 600; letter-spacing: -.01em; line-height: 1.3 }
.sum > p { margin: 3px 0 0; color: var(--mu); max-width: 68ch }
.vals { border: 1px solid var(--line); border-radius: 10px; margin-top: 12px; max-width: 560px; background: var(--bg) }
.vals div { display: flex; justify-content: space-between; gap: 16px; padding: 8px 13px; color: var(--mu); font-size: 13px }
.vals div + div { border-top: 1px solid var(--line) }
.vals .vh { color: var(--fg); font-weight: 500 }
.vals code { font: 12.5px var(--mono); color: var(--fg); text-align: right; overflow-wrap: anywhere } .vals .pg code { color: var(--red) }
.facts { margin-top: 10px; font-size: 13px; color: var(--mu) }
.acts { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 14px }
.clar { margin-top: 14px; max-width: 640px }
.clar label { display: block; font-size: 13px; color: var(--mu); margin-bottom: 6px }
.clar textarea { width: 100%; min-height: 250px; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); line-height: 1.5; resize: vertical }
.event { font-size: 12.5px; color: var(--mu); margin-top: 8px }

.details { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr); gap: 22px; margin-top: 18px; padding-top: 18px; border-top: 1px solid var(--line) }
#pagepane { position: sticky; top: 12px; align-self: start; max-height: calc(100vh - 24px); overflow: auto }
#pagebar { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; color: var(--mu); font-size: 12.5px; flex-wrap: wrap }
#pagewrap { position: relative; background: #fff; border: 1px solid var(--line); line-height: 0 }
#pagewrap img { width: 100%; display: block }
#pagewrap svg { position: absolute; inset: 0; width: 100%; height: 100% }
.nopage { border: 1px solid var(--line); border-radius: 8px; padding: 16px; color: var(--mu) }
.explain { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin-bottom: 4px; font-size: 13.5px }
.explain code { font: 11.5px var(--mono); color: var(--mu); display: block; margin-top: 6px; overflow-wrap: anywhere }
h4 { font-size: 12.5px; font-weight: 400; color: var(--mu); margin: 16px 0 6px }
table.ft { width: 100%; table-layout: fixed; border-collapse: collapse; font-size: 13px }
.ft td, .ft th { padding: 6px 8px 6px 0; text-align: left; vertical-align: top; border-top: 1px solid var(--line); overflow-wrap: anywhere }
.ft th { font-size: 12px; color: var(--mu); font-weight: 400; border-top: 0 } .ft th:nth-child(1) { width: 28% } .ft th:nth-child(4) { width: 25% }
.ft tr.f { cursor: pointer } .ft tr.f:hover { background: var(--sunk) }
.ft tr.f[aria-selected="true"] { background: var(--sunk); box-shadow: inset 2px 0 0 var(--fg) } .ft tr.f[aria-selected="true"] td:first-child { padding-left: 8px }
.ft td.val { font-family: var(--mono); font-size: 12px } .ft td.val .pdf { color: var(--red); display: block }
.ft .st { white-space: nowrap } .ft .st .dot { margin-right: 6px }
.bt { color: var(--mu); font-size: 11.5px }
.rule { border-top: 1px solid var(--line); padding: 7px 0; font-size: 13px } .rule b { font: 12.5px var(--mono) }
.note { font-size: 12px; color: var(--mu); margin-top: 28px; max-width: 80ch }
@media (max-width: 900px) { .details { grid-template-columns: 1fr } #pagepane { position: static; max-height: none } .batch tr.open > td { padding-left: 16px } }
@media (max-width: 640px) { .batch .from, .batch th:nth-child(3) { display: none } main { padding: 20px 14px 40px } header { padding: 12px 14px } }
</style>
</head>
<body>
<header>
  <h1>Receipt Workbench</h1>
  <div class="seg" role="group" aria-label="Language">
    <button id="lang-en" aria-pressed="true">EN</button><button id="lang-de" aria-pressed="false">DE</button>
  </div>
  <button class="link" id="samples" data-t="loadSamples"></button>
  <button class="btn p" id="pick" data-t="upload"></button>
  <input type="file" id="file" multiple accept=".pdf,.xml,application/pdf,text/xml" hidden>
</header>
<main>
  <p id="api-error" class="rule" role="alert" hidden><span class="dot r"></span> <span id="api-error-message"></span></p>
  <section id="empty">
    <h2 data-t="emptyTitle"></h2>
    <p data-t="emptyBody"></p>
    <button class="btn p" id="samples2" data-t="loadSamples"></button>
    <p class="mu" style="margin-top:18px" data-t="drop"></p>
  </section>
  <section id="batch" hidden>
    <div class="top"><h2 id="headline"></h2><span class="mu" data-t="drop"></span><button class="link" id="clear" data-t="clear"></button></div>
    <div id="list"></div>
  </section>
  <p class="note" data-t="disclaimer"></p>
</main>

  msgDiff: (n, p, x) => `${n}: Die Seite zeigt ${p}, in den eingebetteten Daten steht ${x}`,

  msg: (no, date, lines) => `Guten Tag,\n\nwir haben die Rechnung ${no}${date ? " vom " + date : ""} erhalten. Die PDF-Seite und die eingebetteten E-Rechnungsdaten (ZUGFeRD / Factur-X) stimmen nicht überein, oder wir konnten die Übereinstimmung nicht bestätigen:\n\n${lines}\n\nBitte teilen Sie uns mit, welche Werte richtig sind, oder senden Sie eine korrigierte Rechnung. Bis dahin halten wir die Rechnung zurück.\n\nVielen Dank`,
} };

let lang = "en", items = [], openId = null, detail = null, selected = null, page = 1, showDetails = false, clarifying = false, draft = "";
try { lang = localStorage.getItem("rw-lang") || "en" } catch (e) {}
const $ = (s) => document.querySelector(s), t = () => T[lang];
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const STATUS_DOT = { match: "", present: "n", mismatch: "r", ambiguous: "a", not_found: "a", not_checked: "n" };
const BAD = ["failed", "error"];

function fieldName(f) {
  const L = t().fields;
  if (f.key.startsWith("line_")) return `${L.line} ${f.line}`;
  if (f.key.startsWith("vat_")) return `${L.vat} ${f.cells && f.cells.rate ? Number(f.cells.rate) + " %" : ""}`.trim();
  if (f.key.startsWith("unlisted_row")) return L.unlisted_row;
  return L[f.key] || f.key;
}
// The dot is the only status colour in the list: red = a difference or invalid data, amber = could not decide.
function dotClass(it) {
  if (it.status !== "checked") return "a";
  if (it.verdict === "difference_found" || BAD.includes(it.validation.schema) || BAD.includes(it.validation.rules)) return "r";
  if (it.needs_review) return "a";
  return it.verdict === "not_compared" ? "n" : "";
}
function reason(it) {
  const L = t();
  if (it.status !== "checked") return it.status === "unsupported" ? L.unsupported : L.failed;
  const m = it.mismatches || [];
  if (m.length === 1) return L.oneDiffers(fieldName(m[0]));
  if (m.length > 1) return L.manyDiffer(m.length);
  for (const k of ["schema", "rules"]) if (BAD.includes(it.validation[k])) return `${L.checks[k]}: ${L.outcome[it.validation[k]]}`;
  return L.verdict[it.verdict] || "";
}
const open_ = (it) => it.needs_review && !it.decision;
const sorted = () => [...items].sort((a, b) => "ra n".indexOf(dotClass(a) || " ") - "ra n".indexOf(dotClass(b) || " "));

// The headline counts down as invoices are decided. Torph (MIT, vendored, no network) morphs the changed
// characters so the count is seen to change. Without it, or with reduced motion, the text is simply replaced.
let morph = null, headText = "";
function setHeadline(s) {
  if (s === headText) return;
  headText = s; $("#headline").setAttribute("aria-label", s);
  if (morph) morph.update(s); else $("#headline").textContent = s;
}
import("/static/vendor/torph.mjs").then((m) => {
  const el = $("#headline"); el.textContent = "";
  morph = new m.TextMorph({ element: el, duration: 450 }); if (headText) morph.update(headText);
}).catch(() => {});
function applyStatic() {
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-t]").forEach((el) => { el.textContent = t()[el.dataset.t] });
  $("#lang-en").setAttribute("aria-pressed", lang === "en"); $("#lang-de").setAttribute("aria-pressed", lang === "de");
}
function render() {
  const L = t();
  $("#empty").hidden = items.length > 0; $("#batch").hidden = items.length === 0;
  if (!items.length) return;
  setHeadline(L.headline(items.length, items.filter(open_).length));
  let h = `<table class="batch"><thead><tr><th></th><th>${esc(L.th.invoice)}</th><th>${esc(L.th.from)}</th><th>${esc(L.th.amount)}</th><th>${esc(L.th.result)}</th></tr></thead><tbody>`;
  for (const it of sorted()) {
    const isOpen = it.id === openId && detail;
    h += `<tr class="item${it.needs_review ? "" : " fine"}" data-id="${it.id}" tabindex="0" role="button" aria-expanded="${!!isOpen}">
      <td class="d"><span class="dot ${dotClass(it)}"></span></td><td class="no">${esc(it.invoice_number || it.file)}</td>
      <td class="from">${esc(it.seller || it.file)}</td><td class="amt">${it.amount_due ? esc(it.amount_due) + " " + esc(it.currency || "") : ""}</td>
      <td>${esc(reason(it))}${it.decision ? ` <span class="done">· ${esc(L.decisions[it.decision])}</span>` : ""}</td></tr>`;
    if (isOpen) h += `<tr class="open"><td colspan="5">${openHtml()}</td></tr>`;
  }
  $("#list").innerHTML = h + "</tbody></table>";
  if (openId && detail && showDetails) renderPage();
}

// Step 1: what is wrong, in one sentence, with the two values.
function openHtml() {
  const r = detail.result, s = detail.summary, L = t();
  let title, sub = "", vals = "", facts = [];
  if (r.status !== "checked") { title = reason(s); sub = r.error?.message || "" }
  else {
    const c = r.comparison, mm = c.findings.filter((f) => f.status === "mismatch"), bad = r.validation.find((l) => BAD.includes(l.outcome));
    if (mm.length) { title = mm.length === 1 ? L.sumOne(fieldName(mm[0])) : L.sumMany(mm.length); sub = L.sumAdvice }
    else if (bad) { title = L.sumInvalid; sub = bad.results[0] ? bad.results[0].message.replace(/^\[[^\]]+\]-?\s*/, "") : (bad.detail || "") }
    else { title = L.verdict[c.verdict]; sub = c.applicable ? L.verdictText[c.verdict] : (L.reason[c.reason] || "") }
    for (const f of mm.slice(0, 3)) vals += `<div class="vals">${mm.length > 1 ? `<div class="vh">${esc(fieldName(f))}</div>` : ""}
      <div class="pg"><span>${esc(L.pageShows)}</span><code>${esc(f.pdf_values.join(", ") || L.notOnPage)}</code></div>
      <div><span>${esc(L.dataSays)}</span><code>${esc(f.xml_value ?? "")}</code></div></div>`;
    if (mm.length > 3) facts.push(L.moreInDetails(mm.length - 3));
    for (const l of r.validation) facts.push(`${L.checks[l.name] || l.name} ${L.outcome[l.outcome]}`);
    if (c.applicable) facts.push(L.coverageText(c.coverage.all));
  }
  let h = `<div class="sum"><h3>${esc(title)}</h3>${sub ? `<p>${esc(sub)}</p>` : ""}${vals}${facts.length ? `<div class="facts">${esc(facts.join(" · "))}</div>` : ""}`;
  // Step 3: clarification is a drafted message to the sender, saved with the decision.
  if (clarifying) h += `<div class="clar"><label for="msg">${esc(L.clarLabel)}</label><textarea id="msg">${esc(draft)}</textarea>
    <div class="acts"><button class="btn p" data-act="save">${esc(L.saveClar)}</button><button class="btn" data-act="copy">${esc(L.copy)}</button><button class="link" data-act="cancel">${esc(L.cancel)}</button></div></div>`;
  else h += `<div class="acts"><button class="btn p" data-act="reviewed">${esc(L.reviewed)}</button><button class="btn" data-act="clarify">${esc(L.clarify)}</button>
    ${r.status === "checked" ? `<button class="link" data-act="details" aria-expanded="${showDetails}">${esc(showDetails ? L.hideDetails : L.showDetails)}</button>` : ""}
    <a class="link" href="/api/items/${openId}/evidence" download>${esc(L.exportEv)}</a></div>`;
  h += `</div>`;
  if (showDetails && r.status === "checked") h += `<div class="details"><div id="pagepane"></div><div id="fields">${fieldsHtml()}</div></div>`;
  return h;
}

// Step 2: the page with the evidence marked, and every field.
function explainHtml() {
  const L = t(), f = detail.result.comparison.findings.find((x) => x.key === selected);
  if (!f) return "";
  const cellNote = f.cells && f.cells.net_amount && f.cells.net_amount.note;
  const text = f.status === "mismatch" && f.note !== "line_not_on_page" ? L.explainMismatch(f, fieldName(f)) : f.status === "match" ? L.explainMatch(f, fieldName(f)) + (cellNote ? " " + L.notes[cellNote] : "") : (L.notes[f.note] || "");
  return `<div class="explain"><strong>${esc(fieldName(f))}: ${esc(L.status[f.status])}</strong><div>${esc(text)}</div>${f.xml_path ? `<code>${esc(L.xmlPath)}: ${esc(f.xml_path)}</code>` : ""}</div>`;
}
function findingRow(f) {
  let pageVals = f.pdf_values.map(esc).join(", "), data = esc(f.xml_value ?? "");
  if (f.cells && f.key.startsWith("line_")) data += `<div class="bt">${Object.entries(f.cells).map(([k, c]) => `${t().lineCells[k]} ${esc(c.xml)}`).join(" · ")}</div>`;
  if (f.key.startsWith("vat_") && f.cells) data = `${esc(f.cells.amount)}<div class="bt">${esc(f.cells.basis ?? "")} × ${esc(Number(f.cells.rate))} %</div>`;
  return `<tr class="f" data-key="${esc(f.key)}" aria-selected="${f.key === selected}" tabindex="0">
    <td>${esc(fieldName(f))}${f.bt ? ` <span class="bt">${esc(f.bt)}</span>` : ""}</td>
    <td class="val">${data}</td><td class="val">${pageVals ? `<span class="pdf">${pageVals}</span>` : ""}</td>
    <td class="st"><span class="dot ${STATUS_DOT[f.status]}"></span>${esc(t().status[f.status])}</td></tr>`;
}
function fieldsHtml() {
  const r = detail.result, c = r.comparison, L = t();
  let h = `<div id="explain">${explainHtml()}</div>`;
  if (c.applicable) for (const g of ["header", "parties", "payment", "totals", "vat", "lines"]) {
    const fs = c.findings.filter((x) => x.group === g).sort((a, b) => (a.status === "mismatch" ? 0 : 1) - (b.status === "mismatch" ? 0 : 1));
    if (fs.length) h += `<h4>${esc(L.groups[g])}</h4><table class="ft"><tr><th>${esc(L.cols.field)}</th><th>${esc(L.cols.data)}</th><th>${esc(L.cols.page)}</th><th>${esc(L.cols.status)}</th></tr>${fs.map(findingRow).join("")}</table>`;
  }
  if (c.line_note) h += `<p class="bt">${esc(L.profileNoLines)}</p>`;
  h += `<h4>${esc(L.rulesTitle)}</h4>`;
  for (const l of r.validation) {
    h += `<div class="bt">${esc(L.checks[l.name] || l.name)} ${esc(L.outcome[l.outcome])} · ${esc(L.engine)} ${esc(l.engine)}${l.artefact ? " · " + esc(l.artefact) : ""}${l.detail ? " · " + esc(l.detail) : ""}</div>`;
    for (const res of l.results) h += `<div class="rule"><span class="dot ${res.severity === "error" ? "r" : "a"}"></span> <b>${esc(res.rule_id)}</b><div>${esc(res.message)}</div></div>`;
  }
  if (r.validation.every((l) => !l.results.length)) h += `<div class="bt">${esc(L.noRuleIssues)}</div>`;
  const s = detail.summary;
  h += `<h4>${esc(L.record)}</h4><div class="bt">${esc(s.file)}${s.profile ? ` · ${esc(L.profile)} ${esc(s.profile)}` : ""}${r.file.sha256 ? ` · SHA-256 ${esc(r.file.sha256.slice(0, 16))}…` : ""}</div>`;
  for (const e of detail.events) h += `<div class="bt">${esc(e.at)} · ${esc(L.decisions[e.decision])}</div>`;
  return h;
}
function renderPage() {
  const pane = $("#pagepane"); if (!pane) return;
  const r = detail.result, pages = r.pages || [];
  if (!pages.length) { pane.innerHTML = `<div class="nopage">${esc(t().reason[r.comparison?.reason] || t().noPdf)}</div>`; return }
  const p = pages[page - 1], f = (r.comparison?.findings || []).find((x) => x.key === selected);
  const boxes = (f ? f.evidence : []).filter((e) => e.page === page).map((e) => {
    const [x0, y0, x1, y1] = e.bbox, col = e.role === "label" ? "#2b6fd0" : (f.status === "mismatch" || e.role === "other") ? "#d9342a" : "#1d8a4a";
    return `<rect x="${x0 - 2}" y="${y0 - 2}" width="${x1 - x0 + 4}" height="${y1 - y0 + 4}" fill="${col}" fill-opacity="${e.role === "label" ? .1 : .18}" stroke="${col}" stroke-width="1.2" rx="2"/>`;
  }).join("");
  const nav = pages.length > 1 ? pages.map((q) => `<button class="btn" style="padding:2px 8px" data-page="${q.number}" ${q.number === page ? 'aria-current="true"' : ""}>${q.number}</button>`).join("") : "";
  pane.innerHTML = `<div id="pagebar"><span>${esc(t().page)} ${page} / ${pages.length}</span>${nav}<span>${esc(f ? t().legend : t().select)}</span></div>
    <div id="pagewrap"><img src="/api/items/${openId}/page/${page}.png" alt="${esc(t().page)} ${page}"><svg viewBox="0 0 ${p.width} ${p.height}" preserveAspectRatio="none">${boxes}</svg></div>`;
  const rect = pane.querySelector("rect"); if (rect) rect.scrollIntoView({ block: "nearest", behavior: "smooth" });
}
function clarifyText() {
  const r = detail.result, L = t(), s = detail.summary, fs = r.comparison?.findings || [], lines = [];
  for (const f of fs.filter((f) => f.status === "mismatch")) lines.push(f.pdf_values.length ? L.msgDiff(fieldName(f), f.pdf_values.join(", "), f.xml_value) : L.msgMissing(fieldName(f), f.xml_value));
  if (!lines.length) for (const l of r.validation || []) for (const x of l.results.slice(0, 5)) lines.push(`${x.rule_id}: ${x.message}`);
  if (!lines.length) for (const f of fs.filter((f) => ["not_found", "ambiguous"].includes(f.status)).slice(0, 8)) lines.push(L.msgMissing(fieldName(f), f.xml_value));
  if (!lines.length) lines.push(r.error?.message || L.reason[r.comparison?.reason] || reason(s));
  return L.msg(s.invoice_number || s.file, fs.find((f) => f.key === "issue_date")?.xml_value, lines.map((x) => "- " + x).join("\n"));
}

function showApiError(message) {
  $("#api-error").hidden = false;
  $("#api-error-message").textContent = lang === "de" ? ({
    "Request is too large. Please upload fewer or smaller files.": "Die Anfrage ist zu groß. Bitte weniger oder kleinere Dateien hochladen.",
    "Too many files or form fields in this upload.": "Zu viele Dateien oder Formularfelder. Bitte weniger Dateien hochladen.",
    "File is too large. Please choose a smaller file.": "Die Datei ist zu groß. Bitte eine kleinere Datei auswählen.",
    "Inbox is full. Clear it first.": "Der Posteingang ist voll. Bitte zuerst leeren.",
    "Inbox is too small for the six sample invoices.": "Der Posteingang ist zu klein für die sechs Beispielrechnungen.",
    "Too many checks. Please try again later.": "Zu viele Prüfungen. Bitte später erneut versuchen.",
    "Server memory is full. Please try again shortly.": "Der Serverspeicher ist voll. Bitte in Kürze erneut versuchen.",
    "Server is busy. Please try again shortly.": "Der Server ist ausgelastet. Bitte in Kürze erneut versuchen.",
    "All check slots are busy. Please try again shortly.": "Alle Prüfplätze sind belegt. Bitte in Kürze erneut versuchen."
  }[message] || "Die Anfrage ist fehlgeschlagen. Bitte erneut versuchen.") : message;
}
async function api(path, opts) {
  $("#api-error").hidden = true;
  try {
    const response = await fetch(path, opts);
    if (!response.ok) {
      const body = await response.json().catch(() => ({}));
      throw new Error(typeof body.detail === "string" ? body.detail : response.statusText);
    }
    return await response.json();
  } catch (error) { showApiError(error.message); throw error }
}
async function refresh(selectId) {
  items = await api("/api/items");
  const id = selectId || (items.find(open_) || {}).id;
  if (id) await openItem(id); else { openId = detail = null; render() }
}
async function openItem(id) {
  openId = id; selected = null; page = 1; showDetails = clarifying = false;
  detail = await api(`/api/items/${id}`);
  const first = (detail.result.comparison?.findings || []).find((f) => f.status === "mismatch");
  if (first) { selected = first.key; if (first.evidence[0]) page = first.evidence[0].page }
  render();
}
async function decide(decision, note) {
  await api(`/api/items/${openId}/review`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ decision, note }) });
  items = await api("/api/items");
  const next = sorted().find(open_);   // move on to the next invoice that still needs a person
  if (next) await openItem(next.id); else { openId = detail = null; render() }
}
async function upload(files) {
  if (!files.length) return;
  const fd = new FormData(); for (const f of files) fd.append("files", f);
  await api("/api/check", { method: "POST", body: fd }); await refresh();
}
async function loadSamples() { await api("/api/samples", { method: "POST" }); await refresh() }
function setLang(l) { lang = l; try { localStorage.setItem("rw-lang", l) } catch (e) {} applyStatic(); if (clarifying) draft = clarifyText(); render() }
function pickField(tr) {
  selected = tr.dataset.key;
  const f = detail.result.comparison.findings.find((x) => x.key === selected);
  if (f && f.evidence.length && !f.evidence.some((e) => e.page === page)) page = f.evidence[0].page;
  document.querySelectorAll("tr.f").forEach((r) => r.setAttribute("aria-selected", r === tr));
  $("#explain").innerHTML = explainHtml(); renderPage();
}

$("#lang-en").onclick = () => setLang("en"); $("#lang-de").onclick = () => setLang("de");
$("#samples").onclick = $("#samples2").onclick = loadSamples;
$("#pick").onclick = () => $("#file").click();
$("#file").onchange = (e) => { upload([...e.target.files]); e.target.value = "" };
$("#clear").onclick = async () => { await api("/api/items", { method: "DELETE" }); items = []; openId = detail = null; render() };
$("#list").oninput = (e) => { if (e.target.id === "msg") draft = e.target.value };
$("#list").onclick = async (e) => {
  const act = e.target.closest("[data-act]")?.dataset.act;
  if (act === "reviewed") return decide("reviewed", "");
  if (act === "clarify") { clarifying = true; draft = clarifyText(); render(); return $("#msg").focus() }
  if (act === "cancel") { clarifying = false; return render() }
  if (act === "save") return decide("needs_clarification", draft);
  if (act === "copy") { try { await navigator.clipboard.writeText(draft) } catch (err) { $("#msg").select(); document.execCommand("copy") } e.target.textContent = t().copied; return }
  if (act === "details") { showDetails = !showDetails; return render() }
  const pg = e.target.closest("[data-page]"); if (pg) { page = +pg.dataset.page; return renderPage() }
  const tr = e.target.closest("tr.f"); if (tr) return pickField(tr);
  const row = e.target.closest("tr.item");
  if (row) { if (row.dataset.id === openId) { openId = detail = null; render() } else openItem(row.dataset.id) }
};
$("#list").onkeydown = (e) => {
  if (e.key !== "Enter" && e.key !== " ") return;
  const tr = e.target.closest("tr.f, tr.item"); if (tr && tr === e.target) { e.preventDefault(); tr.click() }
};
["dragover", "dragenter"].forEach((n) => document.addEventListener(n, (e) => { e.preventDefault(); document.body.classList.add("over") }));
["dragleave", "drop"].forEach((n) => document.addEventListener(n, (e) => { e.preventDefault(); document.body.classList.remove("over") }));
document.addEventListener("drop", (e) => upload([...e.dataTransfer.files]));
applyStatic(); refresh();
</script>
</body>
</html>
