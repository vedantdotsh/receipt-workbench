<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Receipt Workbench</title>
<style>
/* Layout: inbox rail on the left, the page image in the middle, findings on the right. */
:root {
  --bg: #f5f6f4; --surface: #ffffff; --sunk: #eceeea; --line: #d9ddd6; --fg: #1b211d; --muted: #5d675f;
  --accent: #1f5f4a; --accent-fg: #ffffff;
  --ok: #1d6b3a; --ok-bg: #e2f1e6; --bad: #a3261c; --bad-bg: #f9e3df; --warn: #7a5200; --warn-bg: #f7ecd0;
  --info: #2b4c7e; --info-bg: #e3eaf5; --hl: #d9342a; --hl-ok: #1d8a4a; --hl-label: #2b6fd0;
  --sans: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "Cascadia Mono", Consolas, "SF Mono", monospace;
}
@media (prefers-color-scheme: dark) { :root {
  --bg: #121614; --surface: #1a201d; --sunk: #222a26; --line: #303a34; --fg: #e6ebe7; --muted: #9aa69d;
  --accent: #6cc3a2; --accent-fg: #0d1512;
  --ok: #7fd49b; --ok-bg: #173323; --bad: #ff9a8f; --bad-bg: #40201c; --warn: #f0c56a; --warn-bg: #3a2f14;
  --info: #9fbdee; --info-bg: #1c2a40; color-scheme: dark } }
* { box-sizing: border-box }
html, body { height: 100% }
body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.45 var(--sans); display: flex; flex-direction: column }
button { font: inherit; color: inherit; cursor: pointer }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
header { display: flex; align-items: center; gap: 12px; padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--line); flex-wrap: wrap }
header h1 { font-size: 16px; margin: 0; font-weight: 650; letter-spacing: .01em }
header .tag { color: var(--muted); font-size: 12.5px; flex: 1; min-width: 180px }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 6px 12px }
.btn:hover { background: var(--sunk) }
.btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); font-weight: 600 }
.btn.small { padding: 3px 8px; font-size: 12.5px }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden }
.seg button { border: 0; background: var(--surface); padding: 5px 10px }
.seg button[aria-pressed="true"] { background: var(--fg); color: var(--bg) }
main { flex: 1; min-height: 0; display: grid; grid-template-columns: 300px minmax(0, 1fr) }
#inbox { border-right: 1px solid var(--line); overflow: auto; background: var(--surface) }
#inbox .head { padding: 10px 14px; font-size: 12px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); display: flex; justify-content: space-between; align-items: center }
.row { display: block; width: 100%; text-align: left; border: 0; border-top: 1px solid var(--line); background: none; padding: 10px 14px }
.row:hover { background: var(--sunk) }
.row[aria-current="true"] { background: var(--sunk); box-shadow: inset 3px 0 0 var(--accent) }
.row .top { display: flex; justify-content: space-between; gap: 8px; font-weight: 600 }
.row .top span:last-child { font-variant-numeric: tabular-nums; white-space: nowrap }
.row .sub { color: var(--muted); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.row .chips { margin-top: 5px; display: flex; gap: 5px; flex-wrap: wrap }
.chip { display: inline-block; font-size: 11.5px; font-weight: 600; padding: 1px 7px; border-radius: 10px; background: var(--sunk); color: var(--muted); white-space: nowrap }
.chip.ok { background: var(--ok-bg); color: var(--ok) } .chip.bad { background: var(--bad-bg); color: var(--bad) }
.chip.warn { background: var(--warn-bg); color: var(--warn) } .chip.info { background: var(--info-bg); color: var(--info) }
#empty { padding: 48px 24px; max-width: 620px; margin: auto; text-align: center }
#empty h2 { font-size: 20px; margin: 0 0 8px; text-wrap: balance }
#empty p { color: var(--muted); margin: 0 0 18px }
#drop { border: 2px dashed var(--line); border-radius: 10px; padding: 26px; margin-top: 18px; color: var(--muted) }
#drop.over { border-color: var(--accent); background: var(--sunk) }
#review { min-width: 0; display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); min-height: 0 }
#pagepane { overflow: auto; padding: 14px; background: var(--sunk); min-height: 0 }
#pagebar { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; color: var(--muted); font-size: 12.5px; flex-wrap: wrap }
#pagewrap { position: relative; background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,.25); line-height: 0 }
#pagewrap img { width: 100%; display: block }
#pagewrap svg { position: absolute; inset: 0; width: 100%; height: 100% }
.nopage { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 18px; color: var(--muted); line-height: 1.45 }
#detail { overflow: auto; padding: 16px 18px 40px; min-height: 0; background: var(--bg) }
#detail h2 { font-size: 18px; margin: 0 }
.meta { color: var(--muted); font-size: 12.5px; margin: 2px 0 12px; overflow-wrap: anywhere }
.verdict { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 12px 14px; margin-bottom: 12px }
.verdict strong { font-size: 15px }
.verdict.bad { border-color: var(--bad); } .verdict.warn { border-color: var(--warn) } .verdict.ok { border-color: var(--ok) }
.verdict p { margin: 4px 0 0; color: var(--muted) }
.checks { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; margin-bottom: 14px }
.check { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px }
.check .k { font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted) }
.check .v { font-weight: 600; margin-top: 2px }
.check .d { font-size: 12px; color: var(--muted) }
h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); margin: 18px 0 6px }
table { width: 100%; table-layout: fixed; border-collapse: collapse; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; overflow: hidden }
td, th { padding: 6px 9px; text-align: left; vertical-align: top; border-top: 1px solid var(--line); overflow-wrap: anywhere }
tr:first-child td, tr:first-child th { border-top: 0 }
th { font-size: 11.5px; color: var(--muted); font-weight: 600 } th:nth-child(1) { width: 30% } th:nth-child(4) { width: 24% }
tr.f { cursor: pointer } tr.f:hover { background: var(--sunk) }
tr.f[aria-selected="true"] { background: var(--info-bg) }
td.val { font-family: var(--mono); font-size: 12.5px }
td.val .pdf { color: var(--bad); display: block }
.bt { color: var(--muted); font-size: 11.5px }
.explain { background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--info); border-radius: 6px; padding: 10px 12px; margin: 8px 0 }
.explain code { font-family: var(--mono); font-size: 11.5px; color: var(--muted); display: block; margin-top: 6px; overflow-wrap: anywhere }
.rule { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; margin-top: 6px }
.rule b { font-family: var(--mono); font-size: 12.5px }
textarea { width: 100%; min-height: 60px; font: inherit; padding: 8px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--fg) }
.actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px }
.event { font-size: 12.5px; color: var(--muted); margin-top: 6px }
.note { font-size: 12px; color: var(--muted); margin-top: 22px; border-top: 1px solid var(--line); padding-top: 10px }
[hidden] { display: none !important }
@media (max-width: 1100px) { #review { grid-template-columns: 1fr; overflow: auto } #pagepane, #detail { overflow: visible } }
@media (max-width: 760px) { main { grid-template-columns: 1fr; overflow: auto } #inbox { border-right: 0; border-bottom: 1px solid var(--line); max-height: 40vh } }
</style>
</head>
<body>
<header>
  <h1>Receipt Workbench</h1>
  <span class="tag" data-t="tagline"></span>
  <div class="seg" role="group" aria-label="Language">
    <button id="lang-en" aria-pressed="true">EN</button><button id="lang-de" aria-pressed="false">DE</button>
  </div>
  <button class="btn" id="samples" data-t="loadSamples"></button>
  <button class="btn primary" id="pick" data-t="upload"></button>
  <input type="file" id="file" multiple accept=".pdf,.xml,application/pdf,text/xml" hidden>
</header>
<main>
  <nav id="inbox" aria-label="Inbox">
    <div class="head"><span data-t="inbox"></span><button class="btn small" id="clear" data-t="clear"></button></div>
    <div id="rows"></div>
  </nav>
  <section id="empty">
    <h2 data-t="emptyTitle"></h2>
    <p data-t="emptyBody"></p>
    <button class="btn primary" id="samples2" data-t="loadSamples"></button>
    <div id="drop" data-t="drop"></div>
    <p class="note" data-t="disclaimer"></p>
  </section>
  <section id="review" hidden>
    <div id="pagepane"></div>
    <div id="detail"></div>
  </section>
</main>
<script>

  fields: { invoice_number: "Invoice number", issue_date: "Invoice date", due_date: "Due date", delivery_date: "Delivery date", order_reference: "Order reference", buyer_reference: "Buyer reference", payment_reference: "Payment reference", currency: "Currency", seller_name: "Seller", buyer_name: "Buyer", seller_vat_id: "Seller VAT ID", buyer_vat_id: "Buyer VAT ID", seller_tax_number: "Seller tax number", iban: "IBAN", bic: "BIC", line_total: "Sum of lines", tax_basis_total: "Net total", tax_total: "VAT total", grand_total: "Gross total", due_payable: "Amount due", prepaid: "Prepaid", allowance_total: "Allowances", charge_total: "Charges", vat: "VAT", line: "Line", unlisted_row: "Row on page" },
  notes: { value_on_page_without_label: "The value appears on the page, but not next to a label this tool recognises for the field.", no_label_and_value_not_on_page: "Neither the value nor a recognised label for it was found on the page.", label_shows_other_value: "A label for this field shows another value, but the data's value also appears elsewhere on the page.", line_not_on_page: "This line exists in the data, but neither its description nor its amount is on the page.", line_not_located: "The line could not be located on the page.", line_located_amount_not_confirmed: "The line was located, but its amount was not confirmed.", line_located_no_values_confirmed: "A row with this description was found, but none of its numbers were confirmed.", visible_row_not_in_data: "This row looks like an invoice line but matches no line in the data.", no_iban_on_page: "No IBAN is printed on the page.", no_bic_on_page: "No BIC is printed on the page.", no_vat_id_on_page: "No VAT ID is printed on the page.", vat_id_not_on_page: "This VAT ID is not printed on the page.", name_not_on_page: "The name was not found on the page as written in the data.", reference_not_on_page: "The reference is not printed on the page.", currency_not_on_page: "No currency code or symbol was found on the page.", vat_row_not_located: "The VAT row could not be located on the page.", printed_gross: "The page prints the amount including VAT." },

  select: "Select a row to see where it is on the page.", page: "Page", noPdf: "There is no PDF page for this file.",
  rulesTitle: "Validation results", noRuleIssues: "No rule violations reported.", engine: "Engine",
  reviewTitle: "Review decision", notePh: "Note for the record (optional)", reviewed: "Mark reviewed", clarify: "Needs clarification", exportEv: "Download evidence record",
  decisions: { reviewed: "Reviewed", needs_clarification: "Needs clarification" },
  unsupported: "Not checked", failed: "Processing failed", needsReview: "Needs review", checked: "Checks complete",
  legend: "Red: differs. Green: matches. Blue: the label used.", profile: "Profile", lineCells: { net_amount: "amount", quantity: "quantity", net_price: "unit price" },
  profileNoLines: "This profile carries no invoice lines, so lines cannot be compared.", xmlPath: "Location in data",
},
de: {
  tagline: "Prüft, ob die Seite, die ein Mensch liest, zu den Daten passt, die die Buchhaltung verbucht.",
  loadSamples: "Beispielrechnungen laden", upload: "Dateien prüfen", inbox: "Eingang", clear: "Leeren",
  emptyTitle: "Steht auf der Rechnungsseite dasselbe wie in den eingebetteten Daten?",
  emptyBody: "Eine hybride E-Rechnung (ZUGFeRD, Factur-X) ist ein PDF mit einer zweiten, maschinenlesbaren Kopie. Menschen geben die Seite frei, Software verbucht die Daten. Dieses Werkzeug vergleicht beide, zeigt den Beleg auf der Seite und sagt, was es nicht prüfen konnte.",
  drop: "PDF- oder XML-Dateien hier ablegen. Die Dateien bleiben auf diesem Rechner.",
  disclaimer: "Technische Konsistenzprüfung der PDF-Textebene gegen das eingebettete XML. Keine Steuerberatung, keine Betrugsprüfung, keine Zahlungsfreigabe. Nur Testdaten verwenden.",
  verdict: { difference_found: "Abweichung gefunden", no_difference_in_checked_fields: "Keine Abweichung in den geprüften Feldern", inconclusive: "Nicht eindeutig", not_compared: "Seite und Daten nicht verglichen" },
  verdictText: {
    difference_found: "Mindestens ein Feld zeigt auf der Seite einen anderen Wert als in den eingebetteten Daten.",
    no_difference_in_checked_fields: "Alle gefundenen Felder stimmen überein. Nicht gefundene Felder stehen unten.",
    inconclusive: "Wichtige Felder wurden auf der Seite nicht gefunden. Ob Seite und Daten übereinstimmen, ist offen.",
    not_compared: "" },
  reason: { xml_only: "Dies ist eine reine XML-Rechnung. Es gibt keine eigene Seite zum Vergleichen.", no_text_layer: "Das PDF hat keine Textebene (eventuell ein Scan). Es wurde nichts verglichen.", pdf_text_unreadable: "Der PDF-Text konnte nicht gelesen werden." },
  status: { match: "Stimmt überein", present: "Auf Seite, ohne Beschriftung", mismatch: "Weicht ab", ambiguous: "Unklar", not_found: "Nicht gefunden", not_checked: "Nicht geprüft" },
  outcome: { passed: "Bestanden", failed: "Fehler", not_run: "Nicht ausgeführt", error: "Validator-Fehler" },
  checks: { schema: "Schema", rules: "Geschäftsregeln", compare: "Seite gegen Daten", coverage: "Abdeckung" },
  coverageText: (c) => `${c.match} an Beschriftung bestätigt, ${c.present} auf Seite, ${c.not_found + c.ambiguous} nicht gefunden, von ${c.applicable}`,
  groups: { header: "Kopfdaten", parties: "Beteiligte", payment: "Zahlung", totals: "Summen", vat: "Umsatzsteuer", lines: "Positionen" },
  cols: { field: "Feld", data: "Eingebettete Daten", page: "Seite zeigt", status: "Ergebnis" },
  fields: { invoice_number: "Rechnungsnummer", issue_date: "Rechnungsdatum", due_date: "Fälligkeit", delivery_date: "Lieferdatum", order_reference: "Bestellnummer", buyer_reference: "Käuferreferenz", payment_reference: "Verwendungszweck", currency: "Währung", seller_name: "Verkäufer", buyer_name: "Käufer", seller_vat_id: "USt-IdNr. Verkäufer", buyer_vat_id: "USt-IdNr. Käufer", seller_tax_number: "Steuernummer Verkäufer", iban: "IBAN", bic: "BIC", line_total: "Summe Positionen", tax_basis_total: "Nettosumme", tax_total: "Umsatzsteuer gesamt", grand_total: "Bruttosumme", due_payable: "Zahlbetrag", prepaid: "Anzahlung", allowance_total: "Abschläge", charge_total: "Zuschläge", vat: "USt", line: "Position", unlisted_row: "Zeile auf Seite" },
  notes: { value_on_page_without_label: "Der Wert steht auf der Seite, aber nicht neben einer Beschriftung, die das Werkzeug für dieses Feld kennt.", no_label_and_value_not_on_page: "Weder der Wert noch eine bekannte Beschriftung wurde auf der Seite gefunden.", label_shows_other_value: "Eine Beschriftung für dieses Feld zeigt einen anderen Wert, der Wert aus den Daten steht aber an anderer Stelle.", line_not_on_page: "Diese Position steht in den Daten, aber weder Bezeichnung noch Betrag stehen auf der Seite.", line_not_located: "Die Position wurde auf der Seite nicht gefunden.", line_located_amount_not_confirmed: "Die Position wurde gefunden, der Betrag aber nicht bestätigt.", line_located_no_values_confirmed: "Eine Zeile mit dieser Bezeichnung wurde gefunden, aber keine Zahl bestätigt.", visible_row_not_in_data: "Diese Zeile sieht wie eine Position aus, passt aber zu keiner Position in den Daten.", no_iban_on_page: "Auf der Seite steht keine IBAN.", no_bic_on_page: "Auf der Seite steht kein BIC.", no_vat_id_on_page: "Auf der Seite steht keine USt-IdNr.", vat_id_not_on_page: "Diese USt-IdNr. steht nicht auf der Seite.", name_not_on_page: "Der Name steht nicht so auf der Seite wie in den Daten.", reference_not_on_page: "Die Referenz steht nicht auf der Seite.", currency_not_on_page: "Kein Währungscode oder -symbol auf der Seite gefunden.", vat_row_not_located: "Die Steuerzeile wurde auf der Seite nicht gefunden.", printed_gross: "Die Seite zeigt den Betrag inklusive Umsatzsteuer." },
  explainMismatch: (f, n) => `Die Seite zeigt ${f.pdf_values.join(", ") || "einen anderen Wert"} für ${n}. In den eingebetteten Daten steht ${f.xml_value}. Bei einer hybriden Rechnung sind die eingebetteten Daten maßgeblich. Klären Sie vor dem Buchen oder Zahlen mit dem Absender, welcher Wert stimmt.`,
  explainMatch: (f, n) => `${n}: Der Wert aus den Daten wurde an seiner Stelle auf der Seite gefunden.`,
  select: "Zeile auswählen, um die Stelle auf der Seite zu sehen.", page: "Seite", noPdf: "Zu dieser Datei gibt es keine PDF-Seite.",
  rulesTitle: "Validierungsergebnisse", noRuleIssues: "Keine Regelverstöße gemeldet.", engine: "Prüfwerkzeug",
  reviewTitle: "Prüfentscheidung", notePh: "Notiz für die Akte (optional)", reviewed: "Als geprüft markieren", clarify: "Klärung nötig", exportEv: "Prüfnachweis herunterladen",
  decisions: { reviewed: "Geprüft", needs_clarification: "Klärung nötig" },
  unsupported: "Nicht geprüft", failed: "Verarbeitung fehlgeschlagen", needsReview: "Prüfen", checked: "Prüfungen abgeschlossen",
  legend: "Rot: weicht ab. Grün: stimmt. Blau: verwendete Beschriftung.", profile: "Profil", lineCells: { net_amount: "Betrag", quantity: "Menge", net_price: "Einzelpreis" },
  profileNoLines: "Dieses Profil enthält keine Positionen, daher ist kein Positionsvergleich möglich.", xmlPath: "Stelle in den Daten",
} };
let lang = "en", items = [], current = null, detail = null, selected = null, page = 1;
try { lang = localStorage.getItem("rw-lang") || "en" } catch (e) {}
const $ = (s) => document.querySelector(s), t = () => T[lang];
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const STATUS_CLASS = { match: "ok", present: "info", mismatch: "bad", ambiguous: "warn", not_found: "warn", not_checked: "" };
const OUT_CLASS = { passed: "ok", failed: "bad", error: "bad", not_run: "" };
const VERDICT_CLASS = { difference_found: "bad", inconclusive: "warn", no_difference_in_checked_fields: "ok", not_compared: "" };

function fieldName(f) {
  const L = t().fields;
  if (f.key.startsWith("line_")) return `${L.line} ${f.line}`;
  if (f.key.startsWith("vat_")) return `${L.vat} ${f.cells && f.cells.rate ? Number(f.cells.rate) + " %" : ""}`;
  if (f.key.startsWith("unlisted_row")) return L.unlisted_row;
  return L[f.key] || f.key;
}
function applyStatic() {
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-t]").forEach((el) => { el.textContent = t()[el.dataset.t] });
  $("#lang-en").setAttribute("aria-pressed", lang === "en"); $("#lang-de").setAttribute("aria-pressed", lang === "de");
}
function rowChips(it) {
  const c = [];
  if (it.status !== "checked") { c.push(`<span class="chip warn">${esc(it.status === "unsupported" ? t().unsupported : t().failed)}</span>`); return c.join("") }
  for (const k of ["schema", "rules"]) if (it.validation[k] && it.validation[k] !== "passed" && it.validation[k] !== "not_run")
    c.push(`<span class="chip bad">${esc(t().checks[k])}: ${esc(t().outcome[it.validation[k]])}</span>`);
  if (it.verdict) c.push(`<span class="chip ${VERDICT_CLASS[it.verdict]}">${esc(t().verdict[it.verdict])}</span>`);
  if (it.decision) c.push(`<span class="chip info">${esc(t().decisions[it.decision])}</span>`);
  return c.join("");
}
function renderInbox() {
  $("#rows").innerHTML = items.map((it) => `
    <button class="row" data-id="${it.id}" aria-current="${it.id === current}">
      <div class="top"><span>${esc(it.invoice_number || it.file)}</span><span>${it.amount_due ? esc(it.amount_due) + " " + esc(it.currency || "") : ""}</span></div>
      <div class="sub">${esc(it.seller || it.file)}</div>
      <div class="chips">${rowChips(it)}</div>
    </button>`).join("");
  $("#empty").hidden = items.length > 0; $("#review").hidden = items.length === 0; $("#clear").hidden = items.length === 0;
}
async function api(path, opts) { const r = await fetch(path, opts); if (!r.ok) throw new Error((await r.json().catch(() => ({}))).detail || r.statusText); return r.json() }
async function refresh(selectId) {
  items = await api("/api/items"); renderInbox();
  const id = selectId || current || (items.find((i) => i.needs_review) || items[0] || {}).id;
  if (id) open(id);
}
async function open(id) {
  current = id; selected = null; page = 1;
  detail = await api(`/api/items/${id}`);
  const first = (detail.result.comparison?.findings || []).find((f) => f.status === "mismatch");
  if (first) { selected = first.key; if (first.evidence[0]) page = first.evidence[0].page }
  renderInbox(); renderReview();
}
function renderPage() {
  const r = detail.result, pages = r.pages || [];
  if (!pages.length) { $("#pagepane").innerHTML = `<div class="nopage">${esc(r.error?.message || t().reason[r.comparison?.reason] || t().noPdf)}</div>`; return }
  const p = pages[page - 1], f = (r.comparison?.findings || []).find((x) => x.key === selected);
  const boxes = (f ? f.evidence : []).filter((e) => e.page === page).map((e) => {
    const [x0, y0, x1, y1] = e.bbox, col = e.role === "label" ? "var(--hl-label)" : (f.status === "mismatch" || e.role === "other") ? "var(--hl)" : "var(--hl-ok)";
    return `<rect x="${x0 - 2}" y="${y0 - 2}" width="${x1 - x0 + 4}" height="${y1 - y0 + 4}" fill="${col}" fill-opacity="${e.role === "label" ? .1 : .18}" stroke="${col}" stroke-width="1.2" rx="2"/>`;
  }).join("");
  const nav = pages.length > 1 ? pages.map((q) => `<button class="btn small" data-page="${q.number}" ${q.number === page ? 'aria-current="true"' : ""}>${q.number}</button>`).join("") : "";
  $("#pagepane").innerHTML = `<div id="pagebar"><span>${esc(t().page)} ${page} / ${pages.length}</span>${nav}<span>${esc(f ? t().legend : t().select)}</span></div>
    <div id="pagewrap"><img src="/api/items/${current}/page/${page}.png" alt="${esc(t().page)} ${page}"><svg viewBox="0 0 ${p.width} ${p.height}" preserveAspectRatio="none">${boxes}</svg></div>`;
  const rect = $("#pagewrap rect"); if (rect) rect.scrollIntoView({ block: "center", behavior: "smooth" });
}
function findingRow(f) {
  let pageVals = f.pdf_values.map(esc).join(", "), data = esc(f.xml_value ?? "");
  if (f.cells && f.key.startsWith("line_")) {
    const parts = Object.entries(f.cells).map(([k, c]) => `${t().lineCells[k]} ${esc(c.xml)}`).join(" · ");
    data += `<div class="bt">${parts}</div>`;
  }
  if (f.key.startsWith("vat_") && f.cells) data = `${esc(f.cells.amount)}<div class="bt">${esc(f.cells.basis ?? "")} × ${esc(Number(f.cells.rate))} %</div>`;
  return `<tr class="f" data-key="${f.key}" aria-selected="${f.key === selected}" tabindex="0">
    <td>${esc(fieldName(f))}${f.bt ? ` <span class="bt">${esc(f.bt)}</span>` : ""}</td>
    <td class="val">${data}</td><td class="val">${pageVals ? `<span class="pdf">${pageVals}</span>` : ""}</td>
    <td><span class="chip ${STATUS_CLASS[f.status]}">${esc(t().status[f.status])}</span></td></tr>`;
}
function renderReview() {
  renderPage();
  const r = detail.result, s = detail.summary, L = t();
  let h = `<h2>${esc(s.invoice_number || s.file)}</h2><div class="meta">${esc(s.file)}${s.profile ? ` · ${esc(L.profile)} ${esc(s.profile)}` : ""}${r.file.sha256 ? ` · SHA-256 ${esc(r.file.sha256.slice(0, 16))}…` : ""}</div>`;
  if (r.status !== "checked") {
    h += `<div class="verdict warn"><strong>${esc(r.status === "unsupported" ? L.unsupported : L.failed)}</strong><p>${esc(r.error?.message || "")}</p></div>`;
    $("#detail").innerHTML = h; return;
  }
  const c = r.comparison, v = c.verdict;
  h += `<div class="verdict ${VERDICT_CLASS[v]}"><strong>${esc(L.verdict[v])}</strong><p>${esc(c.applicable ? L.verdictText[v] : L.reason[c.reason])}</p></div><div class="checks">`;
  for (const layer of r.validation) h += `<div class="check"><div class="k">${esc(L.checks[layer.name])}</div><div class="v"><span class="chip ${OUT_CLASS[layer.outcome]}">${esc(L.outcome[layer.outcome])}</span></div><div class="d">${layer.results.length ? layer.results.length + " ×" : ""}</div></div>`;
  h += `<div class="check"><div class="k">${esc(L.checks.compare)}</div><div class="v"><span class="chip ${VERDICT_CLASS[v]}">${esc(L.verdict[v])}</span></div></div>`;
  if (c.applicable) h += `<div class="check"><div class="k">${esc(L.checks.coverage)}</div><div class="d">${esc(L.coverageText(c.coverage.all))}</div></div>`;
  h += `</div>`;
  const f = c.findings.find((x) => x.key === selected);
  if (f) {
    const cellNote = f.cells && f.cells.net_amount && f.cells.net_amount.note;
    const text = f.status === "mismatch" && f.note !== "line_not_on_page" ? L.explainMismatch(f, fieldName(f)) : f.status === "match" ? L.explainMatch(f, fieldName(f)) + (cellNote ? " " + L.notes[cellNote] : "") : (L.notes[f.note] || "");
    h += `<div class="explain"><strong>${esc(fieldName(f))}: ${esc(L.status[f.status])}</strong><div>${esc(text)}</div>${f.xml_path ? `<code>${esc(L.xmlPath)}: ${esc(f.xml_path)}</code>` : ""}</div>`;
  }
  if (c.applicable) for (const g of ["header", "parties", "payment", "totals", "vat", "lines"]) {
    const fs = c.findings.filter((x) => x.group === g).sort((a, b) => (a.status === "mismatch" ? 0 : 1) - (b.status === "mismatch" ? 0 : 1));
    if (!fs.length) continue;
    h += `<h3>${esc(L.groups[g])}</h3><table><tr><th>${esc(L.cols.field)}</th><th>${esc(L.cols.data)}</th><th>${esc(L.cols.page)}</th><th>${esc(L.cols.status)}</th></tr>${fs.map(findingRow).join("")}</table>`;
  }
  if (c.line_note) h += `<p class="meta">${esc(L.profileNoLines)}</p>`;
  h += `<h3>${esc(L.rulesTitle)}</h3>`;
  for (const layer of r.validation) {
    h += `<div class="meta">${esc(L.checks[layer.name])}: ${esc(L.outcome[layer.outcome])} · ${esc(L.engine)} ${esc(layer.engine)}${layer.artefact ? " · " + esc(layer.artefact) : ""}${layer.detail ? " · " + esc(layer.detail) : ""}</div>`;
    for (const res of layer.results) h += `<div class="rule"><span class="chip ${res.severity === "error" ? "bad" : "warn"}">${esc(res.severity)}</span> <b>${esc(res.rule_id)}</b><div>${esc(res.message)}</div></div>`;
  }
  if (r.validation.every((l) => !l.results.length)) h += `<div class="meta">${esc(L.noRuleIssues)}</div>`;
  h += `<h3>${esc(L.reviewTitle)}</h3><textarea id="note" placeholder="${esc(L.notePh)}"></textarea><div class="actions">
    <button class="btn primary" data-decision="reviewed">${esc(L.reviewed)}</button><button class="btn" data-decision="needs_clarification">${esc(L.clarify)}</button>
    <a class="btn" href="/api/items/${current}/evidence" download>${esc(L.exportEv)}</a></div>`;
  for (const e of detail.events) h += `<div class="event">${esc(e.at)} · ${esc(L.decisions[e.decision])}${e.note ? " · " + esc(e.note) : ""}</div>`;
  h += `<p class="note">${esc(L.disclaimer)}</p>`;
  $("#detail").innerHTML = h;
}
async function upload(files) {
  if (!files.length) return;
  const fd = new FormData(); for (const f of files) fd.append("files", f);
  const added = await api("/api/check", { method: "POST", body: fd });
  await refresh(added[0]?.id);
}
async function loadSamples() { const added = await api("/api/samples", { method: "POST" }); current = null; await refresh((added.find((a) => a.needs_review) || added[0]).id) }
function setLang(l) { lang = l; try { localStorage.setItem("rw-lang", l) } catch (e) {} applyStatic(); renderInbox(); if (detail && items.length) renderReview() }

$("#lang-en").onclick = () => setLang("en"); $("#lang-de").onclick = () => setLang("de");
$("#samples").onclick = $("#samples2").onclick = loadSamples;
$("#pick").onclick = () => $("#file").click();
$("#file").onchange = (e) => { upload([...e.target.files]); e.target.value = "" };
$("#clear").onclick = async () => { await api("/api/items", { method: "DELETE" }); items = []; current = detail = null; renderInbox() };
$("#rows").onclick = (e) => { const b = e.target.closest(".row"); if (b) open(b.dataset.id) };
$("#pagepane").onclick = (e) => { const b = e.target.closest("[data-page]"); if (b) { page = +b.dataset.page; renderPage() } };
function pick(tr) {
  selected = tr.dataset.key;
  const f = detail.result.comparison.findings.find((x) => x.key === selected);
  if (f && f.evidence.length && !f.evidence.some((e) => e.page === page)) page = f.evidence[0].page;
  const top = $("#detail").scrollTop; renderReview(); $("#detail").scrollTop = top;
}
$("#detail").onclick = async (e) => {
  const tr = e.target.closest("tr.f"); if (tr) return pick(tr);
  const d = e.target.closest("[data-decision]");
  if (d) { const res = await api(`/api/items/${current}/review`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ decision: d.dataset.decision, note: $("#note").value }) }); detail.events = res.events; items = await api("/api/items"); renderInbox(); renderReview() }
};
$("#detail").onkeydown = (e) => { const tr = e.target.closest("tr.f"); if (tr && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); pick(tr) } };
const drop = $("#drop");
["dragover", "dragenter"].forEach((n) => document.addEventListener(n, (e) => { e.preventDefault(); drop.classList.add("over") }));
["dragleave", "drop"].forEach((n) => document.addEventListener(n, (e) => { e.preventDefault(); drop.classList.remove("over") }));
document.addEventListener("drop", (e) => upload([...e.dataTransfer.files]));
applyStatic(); refresh();
</script>
